<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1C8C"/>
      <stop offset="1" stop-color="#14123A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="0.5" stop-color="#FF4D8D"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.34" stop-color="#FFE08A"/>
      <stop offset="0.34" stop-color="#FFC93C"/>
      <stop offset="0.66" stop-color="#FFC93C"/>
      <stop offset="0.66" stop-color="#F4A300"/>
      <stop offset="1" stop-color="#F4A300"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F3F6"/>
      <stop offset="0.5" stop-color="#C3C9D3"/>
      <stop offset="1" stop-color="#8E96A3"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA3B8"/>
      <stop offset="1" stop-color="#F0567A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- The colourful stroke the pencil leaves -->
  <path d="M 157 345 C 192 430, 300 440, 404 372" fill="none" stroke="url(#stroke)" stroke-width="30" stroke-linecap="round"/>

  <!-- Pencil: drawn pointing left, turned so the tip lands at the start of the stroke -->
  <g transform="translate(262 238) rotate(-45)" filter="url(#shadow)">
    <!-- wood cone -->
    <path d="M -150 0 L -96 -32 L -96 32 Z" fill="#F5C890"/>
    <path d="M -150 0 L -96 0 L -96 32 Z" fill="#E3AE6E"/>
    <!-- graphite tip -->
    <path d="M -150 0 L -129 -12.5 L -129 12.5 Z" fill="#2B2B3A"/>
    <!-- body -->
    <rect x="-96" y="-32" width="170" height="64" fill="url(#body)"/>
    <!-- ferrule -->
    <rect x="74" y="-34" width="34" height="68" rx="4" fill="url(#ferrule)"/>
    <rect x="84" y="-34" width="3" height="68" fill="#8E96A3" opacity="0.7"/>
    <rect x="95" y="-34" width="3" height="68" fill="#8E96A3" opacity="0.7"/>
    <!-- eraser -->
    <path d="M 108 -32 L 132 -32 Q 156 -32 156 -8 L 156 8 Q 156 32 132 32 L 108 32 Z" fill="url(#eraser)"/>
  </g>
</svg>
